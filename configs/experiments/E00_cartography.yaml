experiment: {id: E00, name: representation_cartography, mode: discovery}
dataset:
  type: synthetic_relations
  n_samples: 2000
  split: discovery
  invariant_transforms: [paraphrase]
representation:
  sites: [resid_post]
  layers: all
  token_selectors: [last_prompt, target_span_last]
probe:
  type: logistic_regression
  standardize: true
  C_grid: [0.01, 0.1, 1.0, 10.0]
  class_weight: balanced
controls:
  random_labels: true
  text_baseline: tfidf_logreg
  seeds: [0, 1, 2]
outputs:
  save_coefficients: true
  layerwise_metrics: true
