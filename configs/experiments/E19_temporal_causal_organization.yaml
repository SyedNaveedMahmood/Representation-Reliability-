experiment:
  id: E19
  name: temporal_causal_organization
  mode: discovery

dataset:
  # Frozen E15 stateful console generator, fresh e19 namespace and seeds.
  # Loci, layers, horizons and seeds are protocol constants in runners/e19.py.
  type: stateful_console
  n_samples: 800
  split: discovery

representation:
  sites: [resid_post]
  # Loci come from E18's map (state_word_last @ L8, decision @ L24).
  # No layer is searched over here.
  layers: all
  token_selectors: [last_prompt, target_span_last]

probe:
  type: logistic_regression
  standardize: true
  C_grid: [0.01, 0.1, 1.0, 10.0]
  class_weight: balanced

controls:
  random_labels: false
  random_label_seeds: []
  text_baseline: null
  random_features: false

behavior:
  candidates_primary: [" Yes", " No"]
  candidates_secondary: [" yes", " no"]
  free_generation_diagnostic_n: 0

outputs:
  save_coefficients: false
  layerwise_metrics: true
