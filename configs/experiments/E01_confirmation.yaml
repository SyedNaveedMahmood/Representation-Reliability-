experiment:
  id: E01_CONFIRMATION
  name: locked_actionable_representation_confirmation
  mode: confirmation

dataset:
  type: synthetic_relations
  n_samples: 2000
  split: confirmation

representation:
  sites: [resid_post]
  layers: [17, 20, 23, 27]
  token_selectors: [last_prompt]

probe:
  type: logistic_regression
  standardize: true
  C_grid: [0.01, 0.1, 1.0, 10.0]
  class_weight: balanced

controls:
  random_labels: false
  random_label_seeds: []
  text_baseline: null
  random_features: false

behavior:
  candidates_primary: [" Yes", " No"]
  candidates_secondary: [" yes", " no"]
  free_generation_diagnostic_n: 0

outputs:
  save_coefficients: true
  layerwise_metrics: true
