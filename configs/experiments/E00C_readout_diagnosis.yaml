experiment: {id: E00C, name: origin_readout_diagnosis, mode: discovery}
dataset:
  type: synthetic_relations
  n_samples: 2000
  split: discovery
representation:
  sites: [resid_post]
  layers: all
  token_selectors: [last_prompt, target_span_last]
probe:
  type: logistic_regression
  standardize: true
  C_grid: [0.01, 0.1, 1.0, 10.0]
  class_weight: balanced
controls:
  random_labels: true
  random_label_seeds: [0, 1, 2]
  text_baseline: tfidf_logreg
  random_features: false
diagnostics:
  random_init_seeds: [0, 1, 2]
  embed_control: true
  lofo: true
  calibration: true
  chat_arm: true
  fixed_readout: true
  error_subset_analysis: true
behavior:
  candidates_primary: [" Yes", " No"]
  free_generation_diagnostic_n: 0
outputs:
  save_coefficients: false
  layerwise_metrics: true
