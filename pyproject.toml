[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "representation-reliability"
version = "0.1.0"
description = "Experiments on decodability, causal use, steering, monitoring, robustness, and safety of LLM representations."
requires-python = ">=3.10,<3.13"
dependencies = [
  "torch>=2.5,<3",
  "transformers>=4.56,<5",
  "accelerate>=1.0",
  "datasets>=3.0",
  "numpy>=1.26",
  "scipy>=1.12",
  "pandas>=2.2",
  "pyarrow>=16",
  "scikit-learn>=1.5",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "tqdm>=4.66",
  "safetensors>=0.4",
  "psutil>=6",
  "pynvml>=11.5",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
instrumentation = ["nnsight"]
quantization = ["optimum-quanto==0.2.7"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
rr = "representation_reliability.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
