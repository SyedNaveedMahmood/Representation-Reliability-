      The causal-utilization curve decays faster than the decodability curve,
      yielding a task-specific causal half-life shorter than representation
      half-life.
    rationale: >
      This avoids a generic static knowing-doing gap and instead measures how
      long represented information remains functionally alive across sequential
      computation.
