schema_version: 1
experiments:
  - id: E00
    name: representation_cartography
    question: Where is a target variable decodable and how stable is its layer/token profile?
    priority: P0
    status: piloted_phase0a
    dimensions: [D, R]
    refs: [nnsight, internal_probing]
    max_gpu_hours: 3
    discovery_signal: Layerwise D reproducibly exceeds random-label/text controls.
    phase_0a_note: >
      Pipeline validated end-to-end (smoke + 500-example pilot + two n=2000
      discovery-scale runs, Qwen3-0.6B, resid_post all layers). Anti-leakage
      construction holds: text baseline collapses to chance at scale. Linear
      decodability of the truth label is only marginal under this
      counterfactual-twin design (best AUROC ~0.53-0.54, CIs include 0.5,
      peak layer moves across data seeds). Gate 1 not yet passed; do not
      escalate causal scans on this dataset variant without either a stronger
      latent or relaxed-purity variants for comparison.


  - id: E01
    name: decode_causal_gap
    question: Does decodable information become causally actionable at the same layers?
    priority: P0
    status: planned
    depends_on: [E00]
    dimensions: [D, C]
    refs: [nnsight, pyvene]
    max_gpu_hours: 6
    discovery_signal: Stable D/C ranking mismatch beyond controls.

