  - id: E13
    name: distillation_reliability_transfer
    question: >
      When a student already contains a highly decodable semantic representation,
      does knowledge distillation transfer the teacher's ability to use it, or
      can representation and causal conversion remain dissociated after distillation?
    priority: P0
    status: proposed_not_authorized
    depends_on: [E01B]
    dimensions: [D, C, R]
    refs: [logit_kd, hidden_state_kd, trajectory_kd, source_free_setpoints]
    max_gpu_hours: 16
    discovery_signal: >
      Distillation regimes move decodability, readout alignment, causal
      conversion, and behavior differently across training checkpoints,
      revealing whether representation transfer and utilization transfer are
      separable.
    rationale: >
      The current 0.6B checkpoint already has near-ceiling D but weak causal
      conversion relative to 1.7B. This creates a controlled setting to ask
      whether distillation repairs use of an existing representation rather
      than merely adding decodable information.
    proposed_design:
      diagnostic_regimes: >
        Frozen student, hard-label SFT, logit KD, one standard
        hidden-state/trajectory KD baseline, and optional combined KD; measure
        B/D/native-readout/C trajectories at fixed training checkpoints.
      method_trigger: >
        Only if standard KD leaves a reproducible teacher-student conversion gap,
        test a conversion-response distillation loss that matches the teacher's
        standardized native-margin response to source-free semantic setpoints.
    execution_policy: >
      Design only. Do not implement or train E13 until E01B is frozen and an
      explicit authorization is given.

  - id: E14
    name: quantization_reliability
    question: >
      Can post-training quantization preserve a highly decodable semantic
      representation while disproportionately degrading its causal utilization
      and native-readout conversion?
    priority: P0
    status: full_discovery_authorized_confirmation_preregistered_locked
    depends_on: [E01B]
    dimensions: [D, B, Q, A, G, R]
    refs:
      [post_training_quantization, source_free_setpoints, factorial_decomposition]
    max_gpu_hours: 6
    discovery_signal: >
      A precision regime leaves semantic D comparatively stable while one or
      more frozen actionability components Q, structured-minus-random A, or
      structured-minus-random G degrade without catastrophic general damage.
    rationale: >
      Quantization perturbs the same trained checkpoint without changing its
      training objective, offering a low-compute test of whether functional
      utilization is more fragile than representational availability.
    proposed_design: >
      Qwen3-1.7B BF16/INT8/INT4 Optimum-Quanto 0.2.7 weight-only ladder;
      precision-native and frozen-BF16-axis D; frozen source-free Q and matched
      versus random orthogonal A/G; L17/L20/L23/L27 tracing; no calibration.
    execution_policy: >
      Stage 0/1 is complete. Full discovery is authorized under the frozen
      E14 full protocol. A single new E14-specific confirmation campaign is
      authorized only if the full-discovery D/G/integrity gate passes. Do not
      reuse E01 confirmation or run another model/backend or bit width.
    full_preregistration:
      protocol: docs/E14_FULL_DISCOVERY_AND_CONFIRMATION_PROTOCOL.md
      protocol_sha256: 54e5d6865ea91f41936948271b3bfcf357240017e82ba853733bef67bd5dbbef
      model_revision: 70d244cc86ccca08cf5af4e1e306ecf908b1ad5e
      precisions: [bf16, int8, int4]
      full_discovery_pairs: 150
      random_seeds: [1729, 1730, 1731, 1732, 1733, 1734, 1735, 1736, 1737, 1738]
      lambdas: [0.5, 1.0]
      bootstrap_unit: pair_id
      bootstrap_draws: 2000
      trace_layers: [17, 20, 23, 27]
      wikitext_revision: b08601e04326c79dfdd32d625aee71d232d685c3
      hellaswag_revision: 218ec52e09a7e7462a5400043bb9a69a41d06b76
      confirmation_namespace: e14_confirmation_v1
      confirmation_spec_sha256: 2c166f298b9800a6061b854963fb17791c8265c7b9c801aab9ffb1cd276eba50
      confirmation_pairs: 100
      confirmation_accessed_at_preregistration: false
      confirmation_campaigns_authorized: 1
      primary_family: [H14.1_D_native_floor, H14.2_G_degradation, H14.3_A_degradation]
      family_wise_alpha: 0.05
      multiplicity: Holm
    bounded_result:
      runs:
        bf16: E14_ffbf9491977c
        int8: E14_bb53a2c07035
        int4: E14_5f683bd893de
      n_directed_examples: 150
      n_pairs: 75
      result: >
        INT8 preserved both D views and Q/A/G. INT4 preserved precision-native
        D (AUROC 1.000) but reduced frozen-BF16-axis D (0.947), native behavior
        margin AUROC, matched-minus-random A by 14.9%, and matched-minus-random
        G by 49.3%; Q increased rather than degraded. Prompt perplexity did not
        catastrophically worsen. Pair-cluster CIs excluded zero for the INT4
        A and G reductions. This bounded discovery result motivates, but does
        not authorize, full E14.
      confirmation_accessed: false
      report: E14_BOUNDED_PILOT_SUMMARY.md

  - id: E15
    name: temporal_causal_half_life
    question: >
      In a long-horizon task, can a state variable remain internally decodable
      after its causal influence on future actions has substantially decayed?
    priority: P1
    status: proposed_not_authorized
    depends_on: [E01B]
    dimensions: [D, C, R]
    refs: [long_horizon_state, causal_intervention, temporal_persistence]
    max_gpu_hours: 12
    discovery_signal: >
      The causal-utilization curve decays faster than the decodability curve,
      yielding a task-specific causal half-life shorter than representation
      half-life.
    rationale: >
      This avoids a generic static knowing-doing gap and instead measures how
      long represented information remains functionally alive across sequential
      computation.
    proposed_design: >
      Begin with one structured stateful task having explicit latent state,
      auditable transitions, delayed decisions, matched counterfactual episodes,
      and controlled distractor/horizon variation.
    execution_policy: >
      Design only. Do not implement until a task is separately frozen and an
      explicit authorization is given.

  - id: E16
    name: utilization_emergence_during_training
    question: >
      Does a semantic representation become linearly accessible before the
      model learns to use it causally and behaviorally during training?
    priority: P0
    status: proposed_not_authorized
    depends_on: [E01B]
    dimensions: [D, C, R]
    refs: [training_checkpoints, source_free_setpoints, causal_conversion]
    max_gpu_hours: 12
    discovery_signal: >
      D reaches and sustains a high-performance regime at earlier checkpoints
      than C, with C continuing to rise after D has plateaued.
    rationale: >
      A within-training trajectory can turn the current static checkpoint
      dissociation into a developmental mechanism: representation formation may
      precede functional deployment.
    proposed_design: >
      Use one public training-checkpoint family with stable architecture;
      inspect logarithmically spaced checkpoints first, then densify only around
      a discovered transition.
    execution_policy: >
      Design only. Do not implement until E01B is frozen, a checkpoint family is
      selected, and explicit authorization is given.
