schema_version: 1
experiments:
  - id: E00
    name: representation_cartography
    question: Where is a target variable decodable and how stable is its layer/token profile?
    priority: P0
    status: piloted_phase0a_corrected
    dimensions: [D, R]
    refs: [nnsight, internal_probing]
    max_gpu_hours: 3
    discovery_signal: Layerwise D reproducibly exceeds random-label/text controls.
    phase_0a_note: >
      SUPERSEDED-THEN-CORRECTED. Original probe results (~AUROC 0.53) were
      invalidated by a multi-shard activation/metadata row-ordering bug that
      paired vectors with wrong labels (see INTEGRITY_AUDIT_PHASE_0A1.md).
      Corrected schema-v2 runs (E00_b137cfabe7d3, E00_5162f18f1901, n=2000
      x2 seeds, Qwen3-0.6B) show strong D: AUROC ~1.0 across a stable
      mid/late-layer band (L14-L27), random-label and text controls at chance.
      Gate 1 passes. E00-B behavioral floor on the same task is only partial
      (forced-choice acc 0.598; margin AUROC 0.761): a Case-3-flavored B-D
      dissociation candidate. E00-C has now characterized this condition and
      run the gated Qwen3-1.7B comparison; see E00C.outcome. E01A full
      discovery is now complete; confirmation remains locked.

  - id: E00C
    name: origin_readout_diagnosis
    question: >
      Is the near-saturated truth decodability learned and family-general,
      and why does it fail to reach the native readout / behavior?
    priority: P0
    status: complete_phase0a2_scale_conditioned
    type: non-causal diagnostic
    dimensions: [D, M]
    refs: [random_init_control, lofo_probing, logit_lens]
    depends_on: [E00, E00-B]
    max_gpu_hours: 3
    discovery_signal: >
      Gates A-F of Phase 0A.2: pretrained-vs-random origin gain,
      cross-family LOFO abstraction, calibration/interface insensitivity
      of the B-D gap, error-subset accessibility, fixed-readout mismatch.
    outcome: >
      Qwen3-0.6B passes gates A-F: mid/late D=0.9988 versus matched
      random-init mean=0.4932, LOFO D=0.9680, fixed-readout L=0.7166,
      raw/calibrated/chat balanced accuracy=0.600/0.730/0.500. Verdict:
      learned abstract readout bottleneck supported for this condition.
      The gated Qwen3-1.7B replication preserves D=0.9994 and LOFO D=0.9917
      while raising L=0.8889 and chat behavior=0.9267; calibration reaches
      0.890. The bottleneck is not scale/interface invariant. No causal claim.
    next_recommendation: investigate interface/readout calibration further

  - id: E01A
    name: truth_coordinate_causal_conversion
    question: >
      At frozen layer 17 resid_post/last_prompt, does changing only the decoded
      truth coordinate shift the predeclared Yes-minus-No counterfactual margin
      beyond magnitude-matched direction and source controls?
    priority: P0
    status: complete_discovery_confirmation_locked
    depends_on: [E00, E00C]
    dimensions: [D, C]
    refs: [internal_intervention_adapter, pair_cluster_bootstrap]
    max_gpu_hours: 6
    discovery_signal: Stable dose response and treatment/control separation.
    outcome: >
      Full discovery completed on Qwen3-0.6B (E01A_c6cd215d7bf8) and
      Qwen3-1.7B (E01A_821138e998c7), 300 directed examples / 150 pairs each.
      At alpha=1, truth-coordinate effects are 0.0283 and 0.6621 respectively.
      Both beat random, orthogonal-random, and same-label controls. Neither
      beats the shuffled opposite-label coordinate control at alpha=1 or any
      other non-zero alpha. Exploratory kappa is 0.0174 versus 0.0380. This
      supports causal actionability of the decoded coordinate under the tested
      intervention and stronger conversion in 1.7B, but not matched-source
      specificity. Confirmation was not accessed.
    trace_mechanism_outcome: >
      Post hoc discovery trace analysis finds a mixed bottleneck dominated by
      readout conversion. Standardized injected signal is comparable at L17/L20,
      while 1.7B retains more at L23/L27 and has substantially larger native-margin
      changes and conversion slopes at every traced layer. After controlling
      actual scalar coordinate displacement, matched-source indicator CIs include
      zero in both models. Confirmation remained locked.
    next_recommendation: test source-free setpoints plus orthogonal-context modulation

  - id: E01B
    name: coordinate_setpoint_and_orthogonal_context
    question: >
      Does source-free control reproduce E01A conversion, and does source
      identity or nuisance matching matter when orthogonal source context is
      given an explicit route to influence behavior at fixed scalar displacement?
    priority: P0
    status: authorized_e01b1_implementation_smoke_only
    depends_on: [E01A]
    dimensions: [C, R]
    refs: [internal_intervention_adapter, source_free_setpoints, orthogonal_context_controls]
    max_gpu_hours: 4
    discovery_signal: >
      Source-free setpoints reproduce coordinate dose response; fixed-coordinate
      orthogonal-context contrasts separate matched, same-family shuffled,
      different-family shuffled, and random context effects.
    rationale: >
      E01A matched and shuffled opposite-label coordinate treatments are
      indistinguishable across every non-zero alpha. Trace analysis finds no
      residual matched-source coefficient after scalar displacement, but E01A
      discards orthogonal source information by construction.
    proposed_design:
      source_free_setpoints: >
        Primary targets are validation-only class medians; a secondary pooled
        validation quantile grid Q05/Q25/Q50/Q75/Q95 measures continuous
        setpoint-response. No donor activation is used.
      orthogonal_context_modulation: >
        Conditional on E01B-1, hold the source-free coordinate displacement fixed
        while adding no orthogonal context, matched-twin context, same-family
        shuffled context, different-family shuffled context, same-label context,
        or norm-matched random orthogonal context.
    execution_policy: >
      Immediate authorization covers implementation, unit/GPU contract tests,
      and bounded smoke/pilot of E01B-1 only. Do not run E01B-1 full discovery,
      E01B-2, confirmation, or E13 without a new explicit authorization.

