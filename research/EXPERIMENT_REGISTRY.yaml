schema_version: 1
experiments:
  - id: E00
    name: representation_cartography
    question: Where is a target variable decodable and how stable is its layer/token profile?
    priority: P0
    status: piloted_phase0a_corrected
    dimensions: [D, R]
    refs: [nnsight, internal_probing]
    max_gpu_hours: 3
    discovery_signal: Layerwise D reproducibly exceeds random-label/text controls.
    phase_0a_note: >
      SUPERSEDED-THEN-CORRECTED. Original probe results (~AUROC 0.53) were
      invalidated by a multi-shard activation/metadata row-ordering bug that
      paired vectors with wrong labels (see INTEGRITY_AUDIT_PHASE_0A1.md).
      Corrected schema-v2 runs (E00_b137cfabe7d3, E00_5162f18f1901, n=2000
      x2 seeds, Qwen3-0.6B) show strong D: AUROC ~1.0 across a stable
      mid/late-layer band (L14-L27), random-label and text controls at chance.
      Gate 1 passes. E00-B behavioral floor on the same task is only partial
      (forced-choice acc 0.598; margin AUROC 0.761): a Case-3-flavored B-D
      dissociation candidate. E00-C has now characterized this condition and
      run the gated Qwen3-1.7B comparison; see E00C.outcome. E01A full
      discovery is now complete; confirmation remains locked.

  - id: E00C
    name: origin_readout_diagnosis
    question: >
      Is the near-saturated truth decodability learned and family-general,
      and why does it fail to reach the native readout / behavior?
    priority: P0
    status: complete_phase0a2_scale_conditioned
    type: non-causal diagnostic
    dimensions: [D, M]
    refs: [random_init_control, lofo_probing, logit_lens]
    depends_on: [E00, E00-B]
    max_gpu_hours: 3
    discovery_signal: >
      Gates A-F of Phase 0A.2: pretrained-vs-random origin gain,
      cross-family LOFO abstraction, calibration/interface insensitivity
      of the B-D gap, error-subset accessibility, fixed-readout mismatch.
    outcome: >
      Qwen3-0.6B passes gates A-F: mid/late D=0.9988 versus matched
      random-init mean=0.4932, LOFO D=0.9680, fixed-readout L=0.7166,
      raw/calibrated/chat balanced accuracy=0.600/0.730/0.500. Verdict:
      learned abstract readout bottleneck supported for this condition.
      The gated Qwen3-1.7B replication preserves D=0.9994 and LOFO D=0.9917
      while raising L=0.8889 and chat behavior=0.9267; calibration reaches
      0.890. The bottleneck is not scale/interface invariant. No causal claim.
    next_recommendation: investigate interface/readout calibration further

  - id: E01A
    name: truth_coordinate_causal_conversion
    question: >
      At frozen layer 17 resid_post/last_prompt, does changing only the decoded
      truth coordinate shift the predeclared Yes-minus-No counterfactual margin
      beyond magnitude-matched direction and source controls?
    priority: P0
    status: mechanism_frozen_strong_confirmation
    depends_on: [E00, E00C]
    dimensions: [D, C]
    refs: [internal_intervention_adapter, pair_cluster_bootstrap]
    max_gpu_hours: 6
    discovery_signal: Stable dose response and treatment/control separation.
    outcome: >
      Full discovery completed on Qwen3-0.6B (E01A_c6cd215d7bf8) and
      Qwen3-1.7B (E01A_821138e998c7), 300 directed examples / 150 pairs each.
      At alpha=1, truth-coordinate effects are 0.0283 and 0.6621 respectively.
      Both beat random, orthogonal-random, and same-label controls. Neither
      beats the shuffled opposite-label coordinate control at alpha=1 or any
      other non-zero alpha. Exploratory kappa is 0.0174 versus 0.0380. This
      supports causal actionability of the decoded coordinate under the tested
      intervention and stronger conversion in 1.7B, but not matched-source
      specificity. Confirmation was not accessed.
    trace_mechanism_outcome: >
      Post hoc discovery trace analysis finds a mixed bottleneck dominated by
      readout conversion. Standardized injected signal is comparable at L17/L20,
      while 1.7B retains more at L23/L27 and has substantially larger native-margin
      changes and conversion slopes at every traced layer. After controlling
      actual scalar coordinate displacement, matched-source indicator CIs include
      zero in both models. Confirmation remained locked.
    next_recommendation: test source-free setpoints plus orthogonal-context modulation

  - id: E01B
    name: coordinate_setpoint_and_orthogonal_context
    question: >
      Does source-free control reproduce E01A conversion, and does source
      identity or nuisance matching matter when orthogonal source context is
      given an explicit route to influence behavior at fixed scalar displacement?
    priority: P0
    status: mechanism_frozen_strong_confirmation
    depends_on: [E01A]
    dimensions: [C, R]
    refs: [internal_intervention_adapter, source_free_setpoints, orthogonal_context_controls]
    max_gpu_hours: 4
    discovery_signal: >
      E01B-1 full discovery is complete. Validation-defined donor-free class
      setpoints reproduce E01A effects (0.02625 for 0.6B and 0.66604 for 1.7B)
      and beat norm-matched random/orthogonal controls. Continuous-grid slopes
      are positive in both models, but per-example monotonicity is weak in 0.6B
      and near-uniform in 1.7B. Source-free traces reproduce the mixed bottleneck
      dominated by readout conversion. In frozen E01B-2 full discovery, matched,
      same-family, and different-family opposite-label orthogonal contexts all
      produced positive increments over coordinate-only and random orthogonal
      context at fixed q; matched and same-family were stronger than
      different-family in the aggregate. Lambda-1 structured increments were
      1.127/0.864/0.620 for 0.6B and 3.613/3.080/2.483 for 1.7B; all
      opposite-label structured-minus-random CIs excluded zero. Random
      increments were small but nonzero (-0.020 and 0.064). At L17, structured contexts changed native
      readout while probed q remained fixed, followed by altered downstream q
      propagation. Relation-family ordering was heterogeneous. Confirmation was
      not accessed.
    rationale: >
      E01A matched and shuffled opposite-label coordinate treatments are
      indistinguishable across every non-zero alpha. Trace analysis finds no
      residual matched-source coefficient after scalar displacement, but E01A
      discards orthogonal source information by construction.
    proposed_design:
      source_free_setpoints: >
        Primary targets are validation-only class medians; a secondary pooled
        validation quantile grid Q05/Q25/Q50/Q75/Q95 measures continuous
        setpoint-response. No donor activation is used.
      orthogonal_context_modulation: >
        Conditional on E01B-1, hold the source-free coordinate displacement fixed
        while adding no orthogonal context, matched-twin context, same-family
        shuffled context, different-family shuffled context, same-label context,
        or norm-matched random orthogonal context.
    e01b1_runs:
      qwen3_0_6b: E01B1_e1169f3ffe11
      qwen3_1_7b: E01B1_5b9d70c8cffe
    e01b2_pilot_hypothesis:
      recorded_before_1_7b_pilot: true
      observation: >
        In the frozen 0.6B pilot, matched and same-family orthogonal contexts
        produced substantially larger context increments than norm-matched
        random orthogonal context at the same scalar target; different-family
        context was positive but smaller. All numerical gates passed.
      hypothesis: >
        Orthogonal structured context gates utilization of a fixed decoded
        truth coordinate, with possible relation-family specificity. Evaluate
        this unchanged hypothesis in the already-authorized 1.7B bounded pilot;
        do not tune conditions, lambdas, normalization, or metrics.
      bounded_result: >
        Supported as pilot-only evidence in both models. At lambda 1, matched,
        same-family, and different-family context increments were respectively
        1.108, 0.909, and 0.590 in 0.6B and 3.660, 3.157, and 2.450 in 1.7B;
        random increments were -0.003 and -0.022. Aggregate matched-minus-
        different-family and same-family-minus-different-family CIs excluded
        zero in both models, with heterogeneous family-level ordering.
    e01b2_bounded_runs:
      qwen3_0_6b_smoke: E01B2_d20936222dbc
      qwen3_1_7b_smoke: E01B2_204fd7e0f8d9
      qwen3_0_6b_pilot: E01B2_d013bfeeabfa
      qwen3_1_7b_pilot: E01B2_909b590300eb
    e01b2_full_runs:
      qwen3_0_6b: E01B2_f2d75dab1eba
      qwen3_1_7b: E01B2_e2b4b02cb3a4
    e01b3_preregistration:
      status: authorized_implementation_smoke_pilot_only
      design: docs/E01B3_FACTORIAL_DECOMPOSITION_DESIGN.md
      question: >
        Decompose each frozen E01B-2 context increment into an additive
        context-only effect A and a q-by-context factorial interaction G.
      frozen_arms: [Y00_clean, Y10_setpoint_only, Y01_context_only, Y11_setpoint_plus_context]
      primary_estimand: G = (Y11 - Y10) - (Y01 - Y00)
      bootstrap_unit: pair_id
      trace_layers: [17, 20, 23, 27]
      execution_limit: smoke_and_pilot_only
    e01b3_bounded_runs:
      qwen3_0_6b_smoke: E01B3_079ba20e610a
      qwen3_1_7b_smoke: E01B3_908b50f0b82b
      qwen3_0_6b_pilot: E01B3_735b49dda22e
      qwen3_1_7b_pilot: E01B3_097e8fb1390c
    e01b3_pilot_outcome: >
      Pilot-only factorial evidence separates the E01B-2 increment. In 0.6B,
      lambda-1 matched/same-family/different-family additive effects were
      1.101/0.905/0.587 while the corresponding interactions were
      0.008/0.004/0.003 with all interaction CIs spanning zero. In 1.7B,
      additive effects were 3.548/2.996/2.275 and interactions were
      0.112/0.161/0.175; all three structured-minus-random interaction CIs
      excluded zero. L17 q was preserved and additive readout effects appeared
      immediately; structured downstream q and readout interaction emerged in
      1.7B. This supports mostly additive multidimensional signal in 0.6B and
      mixed additive plus structured gating in 1.7B, pending full discovery.
    e01b3_full_runs:
      qwen3_0_6b: E01B3_84ee4bae8564
      qwen3_1_7b: E01B3_e7462847a558
    e01b3_full_outcome: >
      Full discovery reproduces the factorial scale difference. At lambda 1,
      0.6B matched/same-family/different-family A effects are
      1.121/0.857/0.618, while G effects are 0.006/0.007/0.002 and all
      structured-minus-random G intervals include zero. The 0.6B context effect
      is therefore mostly additive multidimensional signal. In 1.7B, A effects
      are 3.467/2.918/2.287 and G effects are 0.146/0.163/0.196; all three
      structured-minus-random G intervals exclude zero. The 1.7B effect is
      mixed additive plus structured gating, dominated by A. L17 q is preserved
      while A enters native readout immediately; structured downstream G emerges
      only in 1.7B. Additive matched/same-family effects exceed different-family
      effects, but the G ordering reverses, so relation compatibility does not
      form a monotonic positive gating hierarchy. Confirmation was not accessed.
    confirmation_preregistration:
      status: confirmation_preregistered_authorized_once
      protocol: docs/E01_CONFIRMATION_PROTOCOL.md
      protocol_sha256: 46312baf59923a2a0e5d1b755d313cd83b42883760baf7b5ba1209410fba81a3
