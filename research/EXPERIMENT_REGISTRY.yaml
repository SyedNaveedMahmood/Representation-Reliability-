      H3: {estimate: 0.13284375, ci: [0.110312, 0.156095], raw_p: 0.0000099999, holm_p: 0.0000399996, verdict: PASS}
      H4: {estimate: 0.13790625, ci: [0.113219, 0.163469], raw_p: 0.0000099999, holm_p: 0.0000399996, verdict: PASS}
      mechanism_frozen: true
